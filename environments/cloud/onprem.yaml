# Local or on-prem cluster (k3d, kind, kubeadm, RKE2, OpenShift-compatible).
# Empty storageClass uses the cluster default (local-path, longhorn, nfs, etc).

cloud: onprem
storageClass: ""
workerOnly: false

install:
  ingressNginx: false

ingress:
  enabled: false
  className: nginx
  domain: tazama.local

# Kind / Docker Desktop / kubeadm usually have no cloud load balancer.
# LoadBalancer stays <pending> and helm --wait hangs until timeout.
ingressNginx:
  serviceType: NodePort
  serviceAnnotations: {}

valkey:
  replicaEnabled: false
