# SPDX-License-Identifier: Apache-2.0
name: connection-studio-backend
fullnameOverride: connection-studio-backend
replicaCount: 1
service:
  enabled: true
  port: 3010
  targetPort: 3010
probes:
  enabled: true
  path: /
  port: http
startupChecks:
  postgres: true
  valkey: false
  nats: true
env:
  FUNCTION_NAME: connection-studio-backend
  NODE_ENV: dev
  MAX_CPU: "2"
  SESSION_TIMEOUT_MINUTES: "30"
  POSTGRES_USER: postgres
  POSTGRES_DB: configuration
  POSTGRES_PORT: "5432"
  CONFIGURATION_DATABASE: configuration
  CONFIGURATION_DATABASE_USER: postgres
  STARTUP_TYPE: nats
  PRODUCER_STREAM: config.notification
  CONSUMER_STREAM: config.notification
  STREAM_SUBJECT: config.notification
  AUTHENTICATED: "false"
  VITE_APP_TITLE: Tazama Connection Studio
  TAZAMA_AUTH_URL: http://auth-service:3020/v1/auth
  AUTH_PUBLIC_KEY_PATH: /home/app/test-public-key.pem
  CERT_PATH_PUBLIC: /home/app/test-public-key.pem
  ENCRYPTION_KEY: 8fj29dkd82hs91kd93kd82hs91kd83ks
  IV_LENGTH: "16"
  OPENSEARCH_NODE: http://opensearch:9200
  OPENSEARCH_USERNAME: admin
  OPENSEARCH_PASSWORD: admin
  AUDIT_PROVIDER: opensearch
  DEMS_URL: http://dems:3002
  DEAPI_URL: http://deapi:3001
  DEMS_STREAM: dems.notify
  AUTH_URL: http://keycloak:8080
volumeMounts:
  - name: auth-keys
    mountPath: /home/app/test-public-key.pem
    subPath: public.pem
    readOnly: true
volumes:
  - name: auth-keys
    secret:
      secretName: tazama-auth-keys
