# SPDX-License-Identifier: Apache-2.0
name: deapi
fullnameOverride: deapi
replicaCount: 1
service:
  enabled: true
  port: 3001
  targetPort: 3001
probes:
  enabled: true
  path: /
  port: http
startupChecks:
  postgres: true
  valkey: true
  nats: true
env:
  FUNCTION_NAME: data-enrichment-service
  NODE_ENV: dev
  MAX_CPU: "2"
  PORT: "3001"
  POSTGRES_DB: enrichment
  POSTGRES_USER: postgres
  POSTGRES_PORT: "5432"
  STARTUP_TYPE: nats
  PRODUCER_STREAM: enrichment.notification.response
  CONSUMER_STREAM: enrichment.notification
  STREAM_SUBJECT: enrichment.notification
  REDIS_PORT: "6379"
