# SPDX-License-Identifier: Apache-2.0
name: dems
fullnameOverride: dems
replicaCount: 1
service:
  enabled: true
  port: 3002
  targetPort: 3002
probes:
  enabled: true
  path: /
  port: http
startupChecks:
  postgres: true
  valkey: true
  nats: true
env:
  FUNCTION_NAME: event-monitoring-service
  NODE_ENV: dev
  MAX_CPU: "1"
  APP_PORT: "3002"
  DB_NAME: configuration
  DB_PORT: "5432"
  STARTUP_TYPE: nats
  PRODUCER_STREAM: dems.notification.response
  CONSUMER_STREAM: config.notification
