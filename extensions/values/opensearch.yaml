# SPDX-License-Identifier: Apache-2.0
singleNode: true
replicas: 1
# Security plugin is off, so HTTP not HTTPS. Apps use http://opensearch:9200.
protocol: http
persistence:
  enabled: true
  size: 20Gi
  enableInitChown: true
extraEnvs:
  - name: DISABLE_SECURITY_PLUGIN
    value: "true"
  - name: DISABLE_INSTALL_DEMO_CONFIG
    value: "true"
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
# Chart Service is opensearch-cluster-master. Studio/CMS look up host "opensearch".
extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: opensearch
      labels:
        app.kubernetes.io/part-of: tazama
    spec:
      type: ClusterIP
      ports:
        - name: http
          port: 9200
          targetPort: 9200
      selector:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/instance: opensearch
