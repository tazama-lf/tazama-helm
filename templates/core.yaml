{{- if .Values.core.enabled }}
apiVersion: v1
kind: Service
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "core-postgres") | nindent 2 }}
spec:
  type: {{ .Values.core.postgres.service.type }}
  selector:
    {{- include "tazama.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core-postgres
  ports:
    - name: postgres
      port: {{ .Values.core.postgres.service.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "core-postgres") | nindent 2 }}
spec:
  serviceName: {{ include "tazama.core.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tazama.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core-postgres
  template:
    metadata:
      labels:
        {{- include "tazama.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core-postgres
      annotations:
        {{- include "tazama.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "tazama.podSpec" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "tazama.image" (dict "root" . "repository" .Values.core.postgres.image.repository "tag" .Values.core.postgres.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_MAX_CONNECTIONS
              value: {{ .Values.core.postgres.tuning.maxConnections | quote }}
            - name: POSTGRES_SHARED_BUFFERS
              value: {{ .Values.core.postgres.tuning.sharedBuffers | quote }}
            - name: POSTGRES_EFFECTIVE_CACHE_SIZE
              value: {{ .Values.core.postgres.tuning.effectiveCacheSize | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            {{- if .Values.core.postgres.bootstrap.enabled }}
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d/00-CREATE.sql
              subPath: 00-CREATE.sql
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d/01-tcs-init.sql
              subPath: 01-tcs-init.sql
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d/02-trs-init.sql
              subPath: 02-trs-init.sql
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d/03-DATA.sql
              subPath: 03-DATA.sql
            {{- end }}
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.core.postgres.resources | nindent 12 }}
      volumes:
        {{- if .Values.core.postgres.bootstrap.enabled }}
        - name: bootstrap
          configMap:
            name: {{ include "tazama.componentname" (dict "root" . "name" "core-postgres-bootstrap") }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.core.postgres.persistence.accessModes | nindent 10 }}
        {{- $storageClass := .Values.core.postgres.persistence.storageClass | default .Values.global.storageClass }}
        {{- if $storageClass }}
        storageClassName: {{ $storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.core.postgres.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "core-valkey") | nindent 2 }}
spec:
  type: {{ .Values.core.valkey.service.type }}
  selector:
    {{- include "tazama.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core-valkey
  ports:
    - name: redis
      port: {{ .Values.core.valkey.service.port }}
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "core-valkey") | nindent 2 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tazama.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core-valkey
  template:
    metadata:
      labels:
        {{- include "tazama.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core-valkey
    spec:
      {{- include "tazama.podSpec" . | nindent 6 }}
      containers:
        - name: valkey
          image: {{ include "tazama.image" (dict "root" . "repository" .Values.core.valkey.image.repository "tag" .Values.core.valkey.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["valkey-server", "--port", "6379", "--loglevel", "verbose"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -p 6379 ping | grep PONG"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -p 6379 ping | grep PONG"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.core.valkey.resources | nindent 12 }}
---
