      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "core-admin") | nindent 2 }}
spec:
  replicas: {{ .Values.core.replicaCount }}
  selector:
    matchLabels:
      {{- include "tazama.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core-admin
  template:
    metadata:
      labels:
        {{- include "tazama.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core-admin
    spec:
      {{- include "tazama.podSpec" . | nindent 6 }}
      {{- include "tazama.coreDependencyInitContainers" . | nindent 6 }}
      containers:
        - name: admin-service
          image: {{ include "tazama.image" (dict "root" . "repository" .Values.core.images.adminService.repository "tag" .Values.core.images.adminService.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "tazama.containerSecurityContext" . | nindent 10 }}
          {{- include "tazama.envFrom" (dict "root" . "component" "core-env-admin") | nindent 10 }}
          env:
            - name: EVALUATION_DATABASE_HOST
              value: {{ include "tazama.core.postgresHost" . }}
            - name: CONFIGURATION_DATABASE_HOST
              value: {{ include "tazama.core.postgresHost" . }}
            - name: EVENT_HISTORY_DATABASE_HOST
              value: {{ include "tazama.core.postgresHost" . }}
            - name: RAW_HISTORY_DATABASE_HOST
              value: {{ include "tazama.core.postgresHost" . }}
            - name: EVALUATION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: CONFIGURATION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: RAW_HISTORY_DATABASE
              value: raw_history
            - name: EVENT_HISTORY_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: POSTGRES_USER
            - name: EVENT_HISTORY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: RAW_HISTORY_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: POSTGRES_USER
            - name: RAW_HISTORY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: REDIS_SERVERS
              value: {{ printf "[{\"host\":\"%s\", \"port\":6379}]" (include "tazama.core.valkeyHost" .) | quote }}
            - name: STARTUP_TYPE
              value: nats
            - name: SERVER_URL
              value: {{ printf "%s:%v" (include "tazama.core.natsHost" .) .Values.core.nats.service.clientPort | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: POSTGRES_PASSWORD
            {{- if .Values.core.auth.enabled }}
            - name: AUTHENTICATED
              value: "true"
            - name: CERT_PATH_PUBLIC
              value: /auth/test-public-key.pem
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.core.services.admin.port }}
          {{- if .Values.core.auth.enabled }}
          volumeMounts:
            - name: auth-keys
              mountPath: /auth
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
      volumes:
        {{- if .Values.core.auth.enabled }}
        - name: auth-keys
          secret:
            secretName: {{ .Values.extensions.authPublicKeySecretName }}
        {{- end }}
---
