{{- if .Values.core.auth.enabled }}
apiVersion: v1
kind: Service
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "core-keycloak") | nindent 2 }}
spec:
  selector:
    {{- include "tazama.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
{{- if .Values.core.keycloak.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "core-keycloak-data") | nindent 2 }}
spec:
  accessModes:
    {{- toYaml .Values.core.keycloak.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.core.keycloak.persistence.size | quote }}
  {{- with .Values.core.keycloak.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "core-keycloak") | nindent 2 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tazama.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core-keycloak
  template:
    metadata:
      labels:
        {{- include "tazama.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core-keycloak
    spec:
      {{- include "tazama.podSpec" . | nindent 6 }}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:23.0.6
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HOSTNAME_STRICT_BACKCHANNEL
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_PROXY
              value: edge
            - name: KEYCLOAK_IMPORT_STRATEGY
              value: IGNORE_EXISTING
            - name: QUARKUS_HTTP_ACCESS_LOG_ENABLED
              value: "true"
            - name: KC_LOG_LEVEL
              value: INFO
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            {{- if .Values.core.keycloak.persistence.enabled }}
            - name: keycloak-data
              mountPath: /opt/keycloak/data/h2
            {{- end }}
            - name: keycloak-realm
              mountPath: /opt/keycloak/data/import/00-tazama-test-realm.json
              subPath: 00-tazama-test-realm.json
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
      volumes:
        {{- if .Values.core.keycloak.persistence.enabled }}
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: {{ include "tazama.componentname" (dict "root" . "name" "core-keycloak-data") }}
        {{- end }}
        - name: keycloak-realm
          configMap:
            name: {{ include "tazama.componentname" (dict "root" . "name" "core-keycloak-realm") }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "core-auth") | nindent 2 }}
spec:
  selector:
    {{- include "tazama.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: core-auth
  ports:
    - name: http
      port: 3020
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "core-auth") | nindent 2 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tazama.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core-auth
  template:
    metadata:
      labels:
        {{- include "tazama.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core-auth
    spec:
      {{- include "tazama.podSpec" . | nindent 6 }}
      containers:
        - name: auth
          image: {{ include "tazama.image" (dict "root" . "repository" "tazamaorg/auth-service" "tag" .Values.global.tazamaVersion) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "tazama.containerSecurityContext" . | nindent 10 }}
          env:
            - name: FUNCTION_NAME
              value: auth-service
            - name: NODE_ENV
              value: dev
            - name: MAX_CPU
              value: "1"
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3020"
            - name: AUTH_PROVIDER
              value: "@tazama-lf/auth-lib-provider-keycloak"
            - name: CERT_PATH_PRIVATE
              value: test-private-key.pem
            - name: KEYCLOAK_SERVER_URL
              value: {{ printf "http://%s:8080" (include "tazama.componentname" (dict "root" . "name" "core-keycloak")) | quote }}
            - name: AUTH_URL
              value: {{ printf "http://%s:8080" (include "tazama.componentname" (dict "root" . "name" "core-keycloak")) | quote }}
            - name: KEYCLOAK_REALM
              value: tazama
            - name: CLIENT_SECRET
              value: auth-lib-client-test-secret
            - name: CLIENT_ID
              value: auth-lib-client
            - name: LOG_LEVEL
              value: info
            - name: CERT_PATH_PUBLIC
              value: /auth/test-public-key.pem
          ports:
            - name: http
              containerPort: 3020
          volumeMounts:
            - name: auth-keys
              mountPath: /home/app/test-private-key.pem
              subPath: test-private-key.pem
              readOnly: true
            - name: auth-keys
              mountPath: /home/app/test-public-key.pem
              subPath: test-public-key.pem
              readOnly: true
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
      volumes:
        - name: auth-keys
          secret:
            secretName: {{ .Values.extensions.authPublicKeySecretName }}
{{- end }}
{{- if .Values.core.rules.fullEnabled }}
---
{{- range $rule := .Values.core.rules.enabledRules }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tazama.componentname" (dict "root" $ "name" (printf "rule-%s" $rule)) }}
  namespace: {{ include "tazama.namespace" $ }}
  labels:
    {{- include "tazama.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tazama.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ printf "rule-%s" $rule }}
  template:
    metadata:
      labels:
        {{- include "tazama.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ printf "rule-%s" $rule }}
    spec:
      {{- include "tazama.podSpec" $ | nindent 6 }}
      {{- include "tazama.coreDependencyInitContainers" $ | nindent 6 }}
      containers:
        - name: {{ printf "rule-%s" $rule }}
          image: {{ include "tazama.image" (dict "root" $ "repository" (printf "tazamaorg/rule-%s" $rule) "tag" $.Values.global.tazamaVersion) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- include "tazama.containerSecurityContext" $ | nindent 10 }}
          env:
            - name: FUNCTION_NAME
              value: {{ printf "rule-%s-rel-%s" $rule $.Values.global.tazamaVersion | quote }}
            - name: RULE_VERSION
              value: "1.0.0"
            - name: RULE_NAME
              value: {{ $rule | quote }}
            - name: NODE_ENV
              value: dev
            - name: MAX_CPU
              value: "1"
            - name: SUPPRESS_ALERTS
              value: "true"
            - name: LOCAL_CACHETTL
              value: "300"
            - name: LOCAL_CACHE_ENABLED
              value: "true"
            - name: RAW_HISTORY_DATABASE
              value: raw_history
            - name: RAW_HISTORY_DATABASE_HOST
              value: {{ include "tazama.core.postgresHost" $ }}
            - name: RAW_HISTORY_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" $ }}
                  key: POSTGRES_USER
            - name: RAW_HISTORY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" $ }}
                  key: POSTGRES_PASSWORD
            - name: CONFIGURATION_DATABASE
              value: configuration
            - name: CONFIGURATION_DATABASE_HOST
              value: {{ include "tazama.core.postgresHost" $ }}
            - name: CONFIGURATION_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" $ }}
                  key: POSTGRES_USER
            - name: CONFIGURATION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" $ }}
                  key: POSTGRES_PASSWORD
            - name: EVENT_HISTORY_DATABASE
              value: event_history
            - name: EVENT_HISTORY_DATABASE_HOST
              value: {{ include "tazama.core.postgresHost" $ }}
            - name: EVENT_HISTORY_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" $ }}
                  key: POSTGRES_USER
            - name: EVENT_HISTORY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" $ }}
                  key: POSTGRES_PASSWORD
            - name: LOG_LEVEL
              value: info
            - name: STARTUP_TYPE
              value: nats
            - name: SERVER_URL
              value: {{ printf "%s:%v" (include "tazama.core.natsHost" $) $.Values.core.nats.service.clientPort | quote }}
            - name: APM_ACTIVE
              value: "false"
            - name: APM_SERVICE_NAME
              value: {{ printf "rule-%s" $rule | quote }}
            - name: APM_URL
              value: http://apm:8200
          resources:
            {{- toYaml $.Values.core.resources | nindent 12 }}
---
{{- end }}
{{- end }}
{{- end }}
