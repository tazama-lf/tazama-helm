{{- if .Values.extensionsApis.enabled }}
{{ $tcsFrontendUrl := include "tazama.publicUrlForService" (dict "root" . "service" "extensions-tcs-frontend") }}
{{- range $item := list
    (list "extensions-api-deapi" $.Values.extensionsApis.images.deapi "extensions-apis-env-deapi" $.Values.extensionsApis.services.deapi.port)
    (list "extensions-api-dems" $.Values.extensionsApis.images.dems "extensions-apis-env-dems" $.Values.extensionsApis.services.dems.port)
}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tazama.componentname" (dict "root" $ "name" (index $item 0)) }}
  namespace: {{ include "tazama.namespace" $ }}
  labels:
    {{- include "tazama.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "tazama.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ index $item 0 }}
  ports:
    - name: http
      port: {{ index $item 3 }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tazama.componentname" (dict "root" $ "name" (index $item 0)) }}
  namespace: {{ include "tazama.namespace" $ }}
  labels:
    {{- include "tazama.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.extensionsApis.replicaCount }}
  selector:
    matchLabels:
      {{- include "tazama.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ index $item 0 }}
  template:
    metadata:
      labels:
        {{- include "tazama.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ index $item 0 }}
    spec:
      {{- include "tazama.podSpec" $ | nindent 6 }}
      containers:
        - name: {{ index $item 0 }}
          image: {{ include "tazama.image" (dict "root" $ "repository" (index $item 1).repository "tag" (index $item 1).tag) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- include "tazama.containerSecurityContext" $ | nindent 10 }}
          {{- include "tazama.envFrom" (dict "root" $ "component" (index $item 2)) | nindent 10 }}
          env:
            - name: DB_HOST
              value: {{ include "tazama.core.postgresHost" $ }}
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" $ }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" $ }}
                  key: POSTGRES_PASSWORD
            - name: CONFIGURATION_DATABASE_URL
              value: {{ printf "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@%s:5432/configuration" (include "tazama.core.postgresHost" $) | quote }}
            - name: DYNAMIC_HISTORY_DB_HOST
              value: {{ include "tazama.core.postgresHost" $ }}
            - name: EVENT_HISTORY_DB_HOST
              value: {{ include "tazama.core.postgresHost" $ }}
            - name: REDIS_HOST
              value: {{ include "tazama.core.valkeyHost" $ }}
            - name: SERVER_URL
              value: {{ printf "nats://%s:%v" (include "tazama.core.natsHost" $) $.Values.core.nats.service.clientPort | quote }}
            - name: CORS_ORIGINS
              value: {{ $tcsFrontendUrl | quote }}
            - name: TAZAMA_AUTH_URL
              value: {{ printf "http://%s:3020/v1/auth" (include "tazama.componentname" (dict "root" $ "name" "core-auth")) | quote }}
            - name: AUTH_PUBLIC_KEY_PATH
              value: /auth/test-public-key.pem
            - name: CERT_PATH_PUBLIC
              value: /auth/test-public-key.pem
          ports:
            - name: http
              containerPort: {{ index $item 3 }}
          volumeMounts:
            - name: auth-keys
              mountPath: /auth
              readOnly: true
          resources:
            {{- toYaml $.Values.extensionsApis.resources | nindent 12 }}
      volumes:
        - name: auth-keys
          secret:
            secretName: {{ $.Values.extensions.authPublicKeySecretName }}
---
{{- end }}
{{- end }}
{{- if .Values.extensions.enabled }}
{{ $tcsApiUrl := $.Values.extensions.urls.tcsApiUrl | default (include "tazama.publicUrlForService" (dict "root" $ "service" "extensions-tcs-backend")) }}
{{ $trsApiUrl := $.Values.extensions.urls.trsApiUrl | default (include "tazama.publicUrlForService" (dict "root" $ "service" "extensions-trs-backend")) }}
{{ $cmsApiUrl := $.Values.extensions.urls.cmsApiUrl | default (include "tazama.publicUrlForService" (dict "root" $ "service" "extensions-cms-backend")) }}
{{ $adminEndpoint := $.Values.extensions.urls.adminEndpoint | default (include "tazama.publicUrlForService" (dict "root" $ "service" "core-admin")) }}
{{ $authUrl := $.Values.extensions.urls.authUrl | default (include "tazama.publicUrlForService" (dict "root" $ "service" "core-auth" "path" "/v1/auth")) }}
{{ $keycloakUrl := $.Values.extensions.urls.keycloakUrl | default (include "tazama.publicUrlForService" (dict "root" $ "service" "core-keycloak")) }}
{{ $internalAdminUrl := printf "http://%s:%v" (include "tazama.componentname" (dict "root" $ "name" "core-admin")) $.Values.core.services.admin.servicePort }}
{{ $internalAuthUrl := printf "http://%s:3020/v1/auth" (include "tazama.componentname" (dict "root" $ "name" "core-auth")) }}
{{ $internalKeycloakUrl := printf "http://%s:8080" (include "tazama.componentname" (dict "root" $ "name" "core-keycloak")) }}
{{ $internalNatsUrl := printf "nats://%s:%v" (include "tazama.core.natsHost" $) $.Values.core.nats.service.clientPort }}
{{ $internalCorePostgresHost := include "tazama.core.postgresHost" $ }}
apiVersion: v1
kind: Service
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "extensions-postgres") | nindent 2 }}
spec:
  selector:
    {{- include "tazama.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: extensions-postgres
  ports:
    - name: postgres
      port: {{ .Values.extensions.postgres.service.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "extensions-postgres") | nindent 2 }}
spec:
  serviceName: {{ include "tazama.extensions.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tazama.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: extensions-postgres
  template:
    metadata:
      labels:
        {{- include "tazama.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: extensions-postgres
    spec:
      {{- include "tazama.podSpec" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "tazama.image" (dict "root" . "repository" .Values.extensions.postgres.image.repository "tag" .Values.extensions.postgres.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: EXTENSIONS_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: EXTENSIONS_POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.extensions.postgres.persistence.accessModes | nindent 10 }}
        {{- $storageClass := .Values.extensions.postgres.persistence.storageClass | default .Values.global.storageClass }}
        {{- if $storageClass }}
        storageClassName: {{ $storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.extensions.postgres.persistence.size }}
---
