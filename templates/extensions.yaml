apiVersion: batch/v1
kind: Job
metadata:
  {{- include "tazama.metadata" (dict "root" . "name" "extensions-cms-migrate") | nindent 2 }}
spec:
  backoffLimit: {{ .Values.jobs.cmsMigrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "tazama.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: extensions-cms-migrate
    spec:
      restartPolicy: Never
      {{- include "tazama.podSpec" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "tazama.image" (dict "root" . "repository" .Values.extensions.images.cmsMigrate.repository "tag" .Values.extensions.images.cmsMigrate.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sh", "/home/app/migrate.sh"]
          env:
            - name: POSTGRES_HOST
              value: {{ include "tazama.extensions.postgresHost" . }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: EXTENSIONS_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: EXTENSIONS_POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:%s@%s:5432/tazama_cms" .Values.secrets.extensionsPostgres.username .Values.secrets.extensionsPostgres.password (include "tazama.extensions.postgresHost" .) | quote }}
            - name: DWH_DATABASE_URL
              value: {{ printf "postgresql://%s:%s@%s:5432/tazama_dwh" .Values.secrets.extensionsPostgres.username .Values.secrets.extensionsPostgres.password (include "tazama.extensions.postgresHost" .) | quote }}
            - name: EXTENSIONS_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: EXTENSIONS_POSTGRES_USER
            - name: EXTENSIONS_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" . }}
                  key: EXTENSIONS_POSTGRES_PASSWORD
{{- range $item := list
    (list "extensions-tcs-backend" "extensions-tcs-backend" $.Values.extensions.images.tcsBackend "extensions-env-tcs" $.Values.extensions.services.tcsBackend.port)
    (list "extensions-tcs-frontend" "extensions-tcs-frontend" $.Values.extensions.images.tcsFrontend "extensions-env-tcs" $.Values.extensions.services.tcsFrontend.port)
    (list "extensions-trs-backend" "extensions-trs-backend" $.Values.extensions.images.trsBackend "extensions-env-trs" $.Values.extensions.services.trsBackend.port)
    (list "extensions-trs-frontend" "extensions-trs-frontend" $.Values.extensions.images.trsFrontend "extensions-env-trs" $.Values.extensions.services.trsFrontend.port)
    (list "extensions-cms-backend" "extensions-cms-backend" $.Values.extensions.images.cmsBackend "extensions-env-cms" $.Values.extensions.services.cmsBackend.port)
    (list "extensions-cms-frontend" "extensions-cms-frontend" $.Values.extensions.images.cmsFrontend "extensions-env-cms" $.Values.extensions.services.cmsFrontend.port)
}}
