apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tazama.componentname" (dict "root" $ "name" (index $item 0)) }}
  namespace: {{ include "tazama.namespace" $ }}
  labels:
    {{- include "tazama.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.extensions.replicaCount }}
  selector:
    matchLabels:
      {{- include "tazama.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ index $item 1 }}
  template:
    metadata:
      labels:
        {{- include "tazama.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ index $item 1 }}
    spec:
      {{- include "tazama.podSpec" $ | nindent 6 }}
      containers:
        - name: {{ index $item 1 }}
          image: {{ include "tazama.image" (dict "root" $ "repository" (index $item 2).repository "tag" (index $item 2).tag) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- include "tazama.envFrom" (dict "root" $ "component" (index $item 3)) | nindent 10 }}
          env:
            - name: SERVER_A_HOST
              value: {{ include "tazama.componentname" (dict "root" $ "name" "core-tms") }}
            - name: SERVER_B_HOST
              value: {{ include "tazama.componentname" (dict "root" $ "name" "extensions-cms-frontend") }}
            - name: POSTGRES_HOST
              value: {{ include "tazama.extensions.postgresHost" $ }}
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:%s@%s:5432/tazama_cms" $.Values.secrets.extensionsPostgres.username $.Values.secrets.extensionsPostgres.password (include "tazama.extensions.postgresHost" $) | quote }}
            - name: DWH_DATABASE_URL
              value: {{ printf "postgresql://%s:%s@%s:5432/tazama_dwh" $.Values.secrets.extensionsPostgres.username $.Values.secrets.extensionsPostgres.password (include "tazama.extensions.postgresHost" $) | quote }}
            - name: EXTENSIONS_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" $ }}
                  key: EXTENSIONS_POSTGRES_USER
            - name: EXTENSIONS_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tazama.credentialsSecretName" $ }}
                  key: EXTENSIONS_POSTGRES_PASSWORD
            - name: SERVER_URL
              value: {{ printf "nats://%s:%v" (include "tazama.core.natsHost" $) $.Values.core.nats.service.clientPort | quote }}
            - name: OPENSEARCH_NODE
              value: {{ printf "http://%s:9200" (include "tazama.extensions.opensearchHost" $) | quote }}
            - name: SFTP_HOST_CONSUMER
              value: {{ include "tazama.extensions.sftpHost" $ }}
            - name: SFTP_HOST_PRODUCER
              value: {{ include "tazama.extensions.sftpHost" $ }}
            - name: FLOWABLE_URL
              value: {{ printf "http://%s:8080/flowable-rest" (include "tazama.extensions.flowableHost" $) | quote }}
            - name: COUCHDB_URL
              value: {{ printf "http://%s:5984" (include "tazama.extensions.couchdbHost" $) | quote }}
            - name: REDIS_HOST
              value: {{ include "tazama.core.valkeyHost" $ }}
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: redis-password
            - name: TAZAMA_AUTH_URL
              value: {{ $internalAuthUrl | quote }}
            - name: AUTH_PUBLIC_KEY_PATH
              value: /auth/test-public-key.pem
            - name: CERT_PATH_PUBLIC
              value: /auth/test-public-key.pem
            {{- if eq (index $item 0) "extensions-tcs-backend" }}
            - name: POSTGRES_HOST
              value: {{ $internalCorePostgresHost | quote }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: CONFIGURATION_DATABASE_URL
              value: {{ printf "postgresql://%s:%s@%s:5432/configuration" $.Values.secrets.postgres.username $.Values.secrets.postgres.password $internalCorePostgresHost | quote }}
            - name: SERVER_URL
              value: {{ $internalNatsUrl | quote }}
            - name: ADMIN_SERVICE_URL
              value: {{ $internalAdminUrl | quote }}
            - name: AUTH_URL
              value: {{ $internalKeycloakUrl | quote }}
            - name: TAZAMA_AUTH_ADMIN_USERNAME
              value: {{ $.Values.extensions.env.tcs.TAZAMA_AUTH_ADMIN_USERNAME | quote }}
            - name: TAZAMA_AUTH_ADMIN_PASSWORD
              value: {{ $.Values.extensions.env.tcs.TAZAMA_AUTH_ADMIN_PASSWORD | quote }}
            {{- end }}
            {{- if eq (index $item 0) "extensions-trs-backend" }}
            - name: ADMIN_SERVICE_URL
              value: {{ $internalAdminUrl | quote }}
            - name: AUTH_URL
              value: {{ $internalKeycloakUrl | quote }}
            - name: TAZAMA_AUTH_ADMIN_USERNAME
              value: {{ $.Values.extensions.env.trs.TAZAMA_AUTH_ADMIN_USERNAME | default $.Values.extensions.env.tcs.TAZAMA_AUTH_ADMIN_USERNAME | quote }}
            - name: TAZAMA_AUTH_ADMIN_PASSWORD
              value: {{ $.Values.extensions.env.trs.TAZAMA_AUTH_ADMIN_PASSWORD | default $.Values.extensions.env.tcs.TAZAMA_AUTH_ADMIN_PASSWORD | quote }}
            {{- end }}
            {{- if eq (index $item 0) "extensions-cms-backend" }}
            - name: SERVER_URL
              value: {{ $internalNatsUrl | quote }}
            - name: REDIS_HOST
              value: {{ include "tazama.core.valkeyHost" $ | quote }}
            - name: TAZAMA_AUTH_URL
              value: {{ $internalAuthUrl | quote }}
            {{- end }}
            {{- if eq (index $item 0) "extensions-tcs-backend" }}
            - name: CORS_ORIGINS
              value: {{ (printf "http://%s" (include "tazama.ingressHostForService" (dict "root" $ "service" "extensions-tcs-frontend"))) | quote }}
            {{- end }}
            {{- if eq (index $item 0) "extensions-trs-backend" }}
            - name: ALLOWED_ORIGINS
              value: {{ (printf "http://%s" (include "tazama.ingressHostForService" (dict "root" $ "service" "extensions-trs-frontend"))) | quote }}
            {{- end }}
            {{- if or (eq (index $item 0) "extensions-tcs-frontend") (eq (index $item 0) "extensions-trs-frontend") (eq (index $item 0) "extensions-cms-frontend") }}
            - name: TCS_API_URL
              value: {{ $tcsApiUrl | quote }}
            - name: TRS_API_URL
              value: {{ $trsApiUrl | quote }}
            - name: CMS_API_URL
              value: {{ $cmsApiUrl | quote }}
            - name: ADMIN_ENDPOINT
              value: {{ $adminEndpoint | quote }}
            - name: TAZAMA_AUTH_URL
              value: {{ $authUrl | quote }}
            - name: AUTH_URL
              value: {{ $keycloakUrl | quote }}
            - name: VITE_TCS_API_URL
              value: {{ $tcsApiUrl | quote }}
            - name: VITE_TRS_API_URL
              value: {{ $trsApiUrl | quote }}
            - name: VITE_CMS_API_URL
              value: {{ $cmsApiUrl | quote }}
            {{- if eq (index $item 0) "extensions-tcs-frontend" }}
            - name: VITE_API_URL
              value: {{ $tcsApiUrl | quote }}
            - name: VITE_API_BASE_URL
              value: {{ $tcsApiUrl | quote }}
            {{- end }}
            {{- if eq (index $item 0) "extensions-trs-frontend" }}
            - name: VITE_API_URL
              value: {{ $trsApiUrl | quote }}
            {{- end }}
            {{- if eq (index $item 0) "extensions-cms-frontend" }}
            - name: VITE_API_URL
              value: {{ $cmsApiUrl | quote }}
            - name: VITE_API_BASE_URL
              value: {{ $cmsApiUrl | quote }}
            {{- end }}
            - name: VITE_ADMIN_ENDPOINT
              value: {{ $adminEndpoint | quote }}
            - name: VITE_TAZAMA_AUTH_URL
              value: {{ $authUrl | quote }}
            - name: VITE_AUTH_URL
              value: {{ $keycloakUrl | quote }}
            - name: __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
              value: {{ printf ".%s" $.Values.ingress.domain | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ index $item 4 }}
          volumeMounts:
            - name: auth-keys
              mountPath: /auth
              readOnly: true
      volumes:
        - name: auth-keys
          secret:
            secretName: {{ $.Values.extensions.authPublicKeySecretName }}
---
{{- end }}
{{- end }}
