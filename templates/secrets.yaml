apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tazama.credentialsSecretName" . }}
  namespace: {{ include "tazama.namespace" . }}
  labels:
    {{- include "tazama.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
  EXTENSIONS_POSTGRES_USER: {{ .Values.secrets.extensionsPostgres.username | quote }}
  EXTENSIONS_POSTGRES_PASSWORD: {{ .Values.secrets.extensionsPostgres.password | quote }}
  COUCHDB_USER: {{ .Values.secrets.couchdb.username | quote }}
  COUCHDB_PASSWORD: {{ .Values.secrets.couchdb.password | quote }}
  FLOWABLE_ADMIN_USER: {{ .Values.secrets.flowable.username | quote }}
  FLOWABLE_ADMIN_PASSWORD: {{ .Values.secrets.flowable.password | quote }}
  NIFI_ADMIN_USER: {{ .Values.secrets.nifi.username | quote }}
  NIFI_ADMIN_PASSWORD: {{ .Values.secrets.nifi.password | quote }}
  KEYCLOAK_ADMIN: {{ .Values.secrets.keycloak.adminUser | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.keycloak.adminPassword | quote }}
  HASURA_GRAPHQL_ADMIN_SECRET: {{ .Values.secrets.hasura.adminSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.extensions.authPublicKeySecretName }}
  namespace: {{ include "tazama.namespace" . }}
  labels:
    {{- include "tazama.labels" . | nindent 4 }}
type: Opaque
stringData:
  test-public-key.pem: |
{{- if .Values.secrets.auth.publicKey }}
{{ .Values.secrets.auth.publicKey | indent 4 }}
{{- else }}
    # Replace with the public key used by TCS/TRS/CMS auth integrations.
{{- end }}
  test-private-key.pem: |
{{- if .Values.secrets.auth.privateKey }}
{{ .Values.secrets.auth.privateKey | indent 4 }}
{{- else }}
    # Replace with the private key used by the auth service integration.
{{- end }}
