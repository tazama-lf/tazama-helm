# Default values for the Tazama umbrella chart.
# These defaults target a Kubernetes-friendly translation of the Docker Compose
# deployment in branch: tazama/feat/mono-repo-phased-deployment

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
imagePullSecrets: []
commonLabels: {}
commonAnnotations: {}

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

scheduling:
  workerOnly: false
  nodeSelector: {}
  tolerations: []

networkPolicy:
  enabled: false

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  domain: "frmk8s-cluster.sybrin.co.za"
  scheme: "https"
  tlsSecretName: "tlscomsecret"
  hosts:
    - subdomain: keycloak
      service: core-keycloak
      port: 8080
      path: /
      pathType: Prefix
    - subdomain: admin
      service: core-admin
      port: 5100
      path: /
      pathType: Prefix
    - subdomain: auth
      service: core-auth
      port: 3020
      path: /
      pathType: Prefix
    - subdomain: tms
      service: core-tms
      port: 3000
      path: /
      pathType: Prefix
    - subdomain: tcs
      service: extensions-tcs-frontend
      port: 5173
      path: /
      pathType: Prefix
    - subdomain: tcs-api
      service: core-admin
      port: 5100
      path: /
      pathType: Prefix
    - subdomain: auth
      service: core-auth
      port: 3020
      path: /
      pathType: Prefix
    - subdomain: tms
      service: core-tms
      port: 3000
      path: /
      pathType: Prefix
    - subdomain: tcs
      service: extensions-tcs-backend
      port: 3010
      path: /
      pathType: Prefix
    - subdomain: trs
      service: extensions-trs-frontend
      port: 5174
      path: /
      pathType: Prefix
    - subdomain: trs-api
      service: extensions-trs-backend
      port: 3005
      path: /
      pathType: Prefix
    - subdomain: cms
      service: extensions-cms-frontend
      port: 5175
      path: /
      pathType: Prefix
    - subdomain: cms-api
      service: extensions-cms-backend
      port: 3090
      path: /
      pathType: Prefix
    - subdomain: demo
      service: extensions-trs-frontend
      port: 5174
      path: /
      pathType: Prefix
    - subdomain: nifi
      service: biar-nifi
      port: 8080
      path: /
      pathType: Prefix
    - subdomain: recon
      service: biar-recon
      port: 9888
      path: /
      pathType: Prefix
    - subdomain: solr
      service: biar-solr
      port: 8983
      path: /
      pathType: Prefix
  tls: []

global:
  tazamaVersion: "rc"
  imageRegistry: ""
  imagePullPolicy: Always
  startupChecks:
    enabled: true
    postgresImage: postgres:16
    busyboxImage: busybox:1.36
    schemaDatabase: raw_history
    schemaTable: pain013
  serverAHost: "tazama-core"
  serverBHost: "tazama-extensions"
  storageClass: ""
  timezone: "UTC"
  env:
    TAZAMA_VERSION: "rc"
    SERVER_A_HOST: "tazama-core"
    SERVER_B_HOST: "tazama-extensions"
    ADMIN_PORT: "5100"
    TMS_PORT: "5000"
    DEAPI_URL: "tazama-extensions-tcs-backend"
    DEAPI_PORT: "3001"
    DEMS_URL: "tazama-extensions-api-dems"
    DEMS_PORT: "3002"
    TCS_PORT: "3010"
    TCS_FRONTEND_PORT: "5173"
    TRS_BACKEND_PORT: "3005"
    TRS_FRONTEND_PORT: "5174"
    CMS_BACKEND_PORT: "3090"
    CMS_FRONTEND_PORT: "5175"
    POSTGRESQL_CMS_PORT: "15433"
    SFTP_PORT: "12222"
    COUCHDB_PORT: "5984"
    FLOWABLE_PORT: "8081"
    OPENSEARCH_PORT: "9200"
    TIKA_PORT: "9998"
    SOLR_PORT: "8983"
    NIFI_PORT: "8088"

