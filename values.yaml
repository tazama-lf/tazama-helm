core:
  enabled: true
  replicaCount: 1
  auth:
    enabled: true
  keycloak:
    persistence:
      enabled: true
      accessModes: ["ReadWriteOnce"]
      size: 1Gi
      storageClass: ""
  relay:
    enabled: false
  ui:
    enabled: false
  basicLogs:
    enabled: false
  elasticLogs:
    enabled: false
  natsUtilities:
    enabled: false
  batchPpa:
    enabled: false
  pgadmin:
    enabled: false
  hasura:
    enabled: false
  rules:
    fullEnabled: true
    # Extracted from docker-compose.full.rules.yaml by inspection of the branch.
    # Additional rules may be present; extend here as you bring over the full templates.
    enabledRules:
      - "001"
      - "002"
      - "003"
      - "004"
      - "006"
      - "007"
      - "008"
      - "010"
      - "011"
      - "016"
      - "017"
      - "018"
      - "020"
      - "021"
      - "024"
      - "025"
      - "026"
      - "027"
      - "028"
      - "030"
      - "044"
      - "045"
      - "048"
      - "054"
      - "063"
      - "074"
      - "075"
      - "076"
      - "078"
      - "083"
      - "084"
      - "090"
      - "091"
  postgres:
    enabled: true
    image:
      repository: postgres
      tag: "18"
    service:
      port: 5432
      type: ClusterIP
    persistence:
      enabled: true
      accessModes: ["ReadWriteOnce"]
      size: 20Gi
      storageClass: ""
    resources: {}
    tuning:
      maxConnections: "1000"
      sharedBuffers: "512MB"
      effectiveCacheSize: "2GB"
    databases:
      evaluation: evaluation
      configuration: configuration
      eventHistory: event_history
      rawHistory: raw_history
    bootstrap:
      enabled: true
      # The compose file mounts 03-full-dockerhub.sql into the initdb directory.
      # Replace these placeholders with the actual SQL contents or external files.
      configMapName: ""
      fullDockerhubSql: ""
  nats:
    enabled: true
    image:
      repository: nats
      tag: "2"
    service:
      clientPort: 4222
      clusterPort: 6222
      monitorPort: 8222
      type: ClusterIP
    resources: {}
  valkey:
    enabled: true
    image:
      repository: valkey/valkey
      tag: "7.2.5"
    service:
      port: 6379
      type: ClusterIP
    resources: {}
  images:
    adminService:
      repository: tazamaorg/admin-service
      tag: ""
    tms:
      repository: tazamaorg/tms-service
      tag: ""
    eventDirector:
      repository: tazamaorg/event-director
      tag: ""
    typologyProcessor:
      repository: tazamaorg/typology-processor
      tag: ""
    tadp:
      repository: tazamaorg/transaction-aggregation-decisioning-processor
      tag: ""
    eventFlow:
      repository: tazamaorg/event-flow
      tag: ""
  services:
    admin:
      port: 3100
      servicePort: 5100
    tms:
      port: 3000
      servicePort: 3000
    eventDirector:
      port: 3000
    typologyProcessor:
      port: 3000
    tadp:
      port: 3000
    eventFlow:
      port: 3000
  env:
    admin:
      FUNCTION_NAME: admin-service
      MAX_CPU: "1"
      NODE_ENV: dev
      ACTIVE_CONDITIONS_ONLY: "false"
      PORT: "3100"
      APM_SERVICE_NAME: admin-service
      APM_URL: http://apm:8200
      APM_ACTIVE: "false"
      REDIS_DATABASE: "0"
      REDIS_SERVERS: '[{"host":"valkey", "port":6379}]'
      REDIS_IS_CLUSTER: "false"
      DISTRIBUTED_CACHETTL: "300"
      DISTRIBUTED_CACHE_ENABLED: "false"
      EVALUATION_DATABASE: evaluation
      EVALUATION_DATABASE_HOST: postgres
      EVALUATION_DATABASE_USER: postgres
      CONFIGURATION_DATABASE: configuration
      CONFIGURATION_DATABASE_HOST: postgres
      CONFIGURATION_DATABASE_USER: postgres
      EVENT_HISTORY_DATABASE: event_history
      EVENT_HISTORY_DATABASE_HOST: postgres
    tms:
      FUNCTION_NAME: transaction-monitoring-service
      MAX_CPU: "1"
      PORT: "3000"
      QUOTING: "false"
      NODE_ENV: dev
      APM_SERVICE_NAME: tms-service
      APM_URL: http://apm:8200
      APM_ACTIVE: "false"
      REDIS_DATABASE: "0"
      REDIS_SERVERS: '[{"host":"valkey", "port":6379}]'
      REDIS_IS_CLUSTER: "false"
      DISTRIBUTED_CACHETTL: "300"
      DISTRIBUTED_CACHE_ENABLED: "false"
      LOCAL_CACHETTL: "300"
      LOCAL_CACHE_ENABLED: "false"
      RAW_HISTORY_DATABASE: raw_history
      RAW_HISTORY_DATABASE_HOST: postgres
      RAW_HISTORY_DATABASE_USER: postgres
      EVENT_HISTORY_DATABASE: event_history
      EVENT_HISTORY_DATABASE_HOST: postgres
      EVENT_HISTORY_DATABASE_USER: postgres
      LOG_LEVEL: debug
      STARTUP_TYPE: nats
      SERVER_URL: nats:4222
    eventDirector:
      FUNCTION_NAME: event-director
      MAX_CPU: "1"
      PORT: "3000"
      NODE_ENV: dev
      APM_SERVICE_NAME: event-director
      APM_URL: http://apm:8200
      APM_ACTIVE: "false"
      REDIS_DATABASE: "0"
      REDIS_SERVERS: '[{"host":"valkey", "port":6379}]'
      REDIS_IS_CLUSTER: "false"
      DISTRIBUTED_CACHETTL: "300"
      DISTRIBUTED_CACHE_ENABLED: "false"
      LOCAL_CACHETTL: "300"
      LOCAL_CACHE_ENABLED: "false"
      CONFIGURATION_DATABASE: configuration
      CONFIGURATION_DATABASE_HOST: postgres
      CONFIGURATION_DATABASE_USER: postgres
      LOG_LEVEL: info
      STARTUP_TYPE: nats
      SERVER_URL: nats:4222
      CONSUMER_STREAM: event-director
    typologyProcessor:
      FUNCTION_NAME: typology-processor
      NODE_ENV: dev
      MAX_CPU: "1"
      SUPPRESS_ALERTS: "true"
      APM_SERVICE_NAME: typology-processor
      APM_URL: http://apm:8200
      APM_ACTIVE: "false"
      REDIS_DATABASE: "0"
      REDIS_SERVERS: '[{"host":"valkey", "port":6379}]'
      REDIS_IS_CLUSTER: "false"
      DISTRIBUTED_CACHETTL: "300"
      DISTRIBUTED_CACHE_ENABLED: "false"
      LOCAL_CACHETTL: "300"
      LOCAL_CACHE_ENABLED: "false"
      CONFIGURATION_DATABASE: configuration
      CONFIGURATION_DATABASE_HOST: postgres
      CONFIGURATION_DATABASE_USER: postgres
      LOG_LEVEL: info
      STARTUP_TYPE: nats
      SERVER_URL: nats:4222
      INTERDICTION_DESTINATION: global
      INTERDICTION_PRODUCER: interdiction-service
    tadp:
      FUNCTION_NAME: transaction-aggregation-decisioning-processor
      NODE_ENV: dev
      MAX_CPU: "1"
      SUPPRESS_ALERTS: "true"
      APM_URL: http://apm:8200
      APM_ACTIVE: "false"
      APM_SERVICE_NAME: tadp
      REDIS_DATABASE: "0"
      REDIS_SERVERS: '[{"host":"valkey", "port":6379}]'
      REDIS_IS_CLUSTER: "false"
      DISTRIBUTED_CACHETTL: "300"
      DISTRIBUTED_CACHE_ENABLED: "false"
      LOCAL_CACHETTL: "300"
      LOCAL_CACHE_ENABLED: "false"
      RAW_HISTORY_DATABASE: raw_history
      CONFIGURATION_DATABASE: configuration
      EVALUATION_DATABASE: evaluation
      LOG_LEVEL: info
      STARTUP_TYPE: nats
      SERVER_URL: nats:4222
      ALERT_DESTINATION: global
      ALERT_PRODUCER: investigation-service
    eventFlow:
      FUNCTION_NAME: event-flow-rule-processor
      RULE_NAME: EFRuP
      RULE_VERSION: 1.0.0
      NODE_ENV: dev
      MAX_CPU: "1"
      APM_SERVICE_NAME: event-flow
      APM_URL: http://apm:8200
      APM_ACTIVE: "false"
      REDIS_DATABASE: "0"
      REDIS_SERVERS: '[{"host":"valkey", "port":6379}]'
      REDIS_IS_CLUSTER: "false"
      DISTRIBUTED_CACHETTL: "300"
      DISTRIBUTED_CACHE_ENABLED: "false"
      LOCAL_CACHETTL: "300"
      LOCAL_CACHE_ENABLED: "false"
      CONFIGURATION_DATABASE: configuration
      LOG_LEVEL: info
      STARTUP_TYPE: nats
      SERVER_URL: nats:4222
      SUPPRESS_ALERTS: "true"
      INTERDICTION_DESTINATION: global
      INTERDICTION_PRODUCER: interdiction-service
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

extensionsApis:
  enabled: true
  replicaCount: 1
  images:
    deapi:
      repository: tazamaorg/data-enrichment-service
      tag: ""
    dems:
      repository: tazamaorg/event-monitoring-service
      tag: ""
  services:
    deapi:
      port: 3001
    dems:
      port: 3002
  env:
    deapi:
      FUNCTION_NAME: data-enrichment-service
      NODE_ENV: dev
      MAX_CPU: "2"
      PORT: "3001"
      SIZE: 200mb
      CORS_ORIGINS: ""
      POSTGRES_CONTAINER_NAME: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "<set-at-deploy-time>"
      POSTGRES_PASSWORD: "<set-at-deploy-time>"
      POSTGRES_DB: enrichment
      CONFIGURATION_DATABASE_URL: postgresql://postgres:unused@tazama-core-postgres:5432/enrichment
      DB_HOST: tazama-core-postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "<set-at-deploy-time>"
      DB_CERT_PATH: ""
      BATCH_SIZE: "1000"
      REDIS_CONTAINER_NAME: valkey
      REDIS_HOST: tazama-core-valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "<set-at-deploy-time>"
      CACHE_TTL: "7200"
      NATS_CONTAINER_NAME: nats
      SERVER_URL: nats://tazama-core-nats:4222
      NATS_PORT: "4222"
      NATS_HTTP_PORT: "8222"
      STARTUP_TYPE: nats
      PRODUCER_STREAM: enrichment.notification.response
      CONSUMER_STREAM: enrichment.notification
      STREAM_SUBJECT: enrichment.notification
      ENCRYPTION_KEY: "<set-at-deploy-time>"
      SALT_ROUNDS: "10"
      APM_ACTIVE: "false"
      APM_URL: http://localhost:8200
      APM_SECRET_TOKEN: "<set-at-deploy-time>"
      APM_SERVICE_NAME: data-enrichment-service
      TAZAMA_AUTH_URL: http://tazama-core-auth:3020/v1/auth
      AUTH_PUBLIC_KEY_PATH: /auth/test-public-key.pem
      LOGSTASH_LEVEL: debug
    dems:
      FUNCTION_NAME: event-monitoring-service
      NODE_ENV: dev
      MAX_CPU: "1"
      APP_PORT: "3002"
      CORS_ORIGINS: ""
      CONFIGURATION_DATABASE_URL: "<set-at-deploy-time>"
      DB_HOST: tazama-core-postgres
      DB_PORT: "5432"
      DB_USER: "<set-at-deploy-time>"
      DB_PASSWORD: "<set-at-deploy-time>"
      DB_NAME: configuration
      DYNAMIC_HISTORY_DB_HOST: tazama-core-postgres
      DYNAMIC_HISTORY_DB_PORT: "5432"
      DYNAMIC_HISTORY_DB_NAME: raw_history
      DYNAMIC_HISTORY_DB_USER: "<set-at-deploy-time>"
      DYNAMIC_HISTORY_DB_PASSWORD: "<set-at-deploy-time>"
      DYNAMIC_HISTORY_DB_CERT_PATH: ""
