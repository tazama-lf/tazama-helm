      EVENT_HISTORY_DB_NAME: event_history
      EVENT_HISTORY_DB_USER: "<set-at-deploy-time>"
      EVENT_HISTORY_DB_PASSWORD: "<set-at-deploy-time>"
      EVENT_HISTORY_DB_CERT_PATH: ""
      DB_MIN_CONNECTIONS: "8"
      DB_MAX_CONNECTIONS: "500"
      REDIS_HOST: tazama-core-valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "<set-at-deploy-time>"
      TTL: "3600"
      SERVER_URL: nats://tazama-core-nats:4222
      STARTUP_TYPE: nats
      PRODUCER_STREAM: dems.notification.response
      CONSUMER_STREAM: config.notification
      TAZAMA_AUTH_URL: http://tazama-core-auth:3020/v1/auth/login
      AUTH_PUBLIC_KEY_PATH: /auth/test-public-key.pem
      CERT_PATH_PUBLIC: /auth/test-public-key.pem
