# SPDX-License-Identifier: Apache-2.0
#
# Shared defaults. Profile files (core / full / private-rules) and cloud files
# (onprem / eks / gke / aks) overlay this. values/secrets.yaml overlays last.

namespace: tazama
cloud: onprem
storageClass: ""
workerOnly: false

# Replica sizing tier. values/sizing/<sizing>.yaml overlays the replicas map
# below. Default is one pod per service. Set with -Sizing / --sizing.
sizing: standard

# Pods per service. Omitted keys fall back to 1. `rules` applies to every
# enabled rule id, so one step costs one pod per id in rules.enabled.
replicas:
  tms: 1
  admin: 1
  eventDirector: 1
  eventFlow: 1
  typologyProcessor: 1
  eventAdjudicator: 1
  auth: 1
  keycloak: 1
  relay: 1
  rules: 1

global:
  tazamaVersion: "rc"
  imageRegistry: docker.io/tazamaorg
  imagePullPolicy: IfNotPresent
  ruleRel: "4-0-0"

hosts:
  postgresql: postgresql
  postgresqlReplica: postgresql-replica
  nats: nats
  valkey: valkey
  keycloak: keycloak
  opensearch: opensearch
  couchdb: couchdb
  flowable: flowable
  sftp: sftp

ingress:
  enabled: false
  className: nginx
  domain: tazama.local
  annotations: {}
  tls: []
  hosts:
    tms: tms
    admin: admin
    auth: auth
    keycloak: keycloak
    tcs: tcs
    tcsApi: tcs-api
    trs: trs
    trsApi: trs-api
    cms: cms
    cmsApi: cms-api
    nifi: nifi
  nginx:
    serviceType: NodePort
    replicaCount: 1

install:
  postgresql: true
  postgresqlReplica: false
  nats: true
  valkey: true
  ingressNginx: false
  certManager: false
  admin: true
  tms: true
  eventDirector: true
  eventFlow: true
  typologyProcessor: true
  eventAdjudicator: true
  relay: true
  rules: true
  auth: true
  keycloak: true
  demo: false
  batchPpa: false
  connectionStudio: false
  ruleStudio: false
  cms: false
  deapi: false
  dems: false
  opensearch: false
  couchdb: false
  flowable: false
  sftp: false
  biar: false

# AUTHENTICATED on TMS / admin. Auth-service and Keycloak are still installed
# when install.auth / install.keycloak are true. Set true after you trust the
# key pair in values/secrets.yaml.
auth:
  authenticated: false

# Per-service destination transport for the three relays. Helm does not install
# Kafka or RabbitMQ brokers. NATS is already core infra.
relay:
  efrup:
    transport: nats
  tp:
    transport: nats
  ea:
    transport: nats
  kafka:
    brokers: ""
  rabbitmq:
    url: ""
  rest:
    url: ""
    authUsername: ""
    authPassword: ""

rules:
  enabled:
    - "901"
    - "902"
  imageRegistry: ""
  extraEnv: {}

imagePullSecrets: []

postgres:
  imageTag: "18"
  persistenceSize: 10Gi
  replicaPersistenceSize: 10Gi
  # Postgres forks a backend process per connection, so this caps how many
  # pooled client connections the whole stack can hold at once. Every app pod
  # keeps a pool open: raise this with the sizing tier, and budget roughly
  # 5-10 MB of Postgres memory per connection. Past ~500 prefer a connection
  # pooler (PgBouncer) in front of the primary instead of raising it further.
  maxConnections: 200
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

nats:
  jetstreamSize: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

valkey:
  auth: false
  replicaEnabled: false
  replicas: 1
  persistenceSize: 1Gi

ingressNginx:
  replicaCount: 1
  serviceType: NodePort
  serviceAnnotations: {}

startupChecks:
  enabled: true
  postgresImage: postgres:16
  busyboxImage: busybox:1.36
  schemaDatabase: raw_history
  schemaTable: pain013
