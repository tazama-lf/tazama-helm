#
# Copy to values/secrets.yaml (gitignored) before the first install.
# The wrapper replaces dummy values with 20-character URL-safe secrets
# (openssl rand -base64 15, unique per install). Kubernetes Secret objects
# base64-encode them again; keep plaintext strings in this file.
#
# Leave auth.publicKey and auth.privateKey empty. The wrapper generates a
# matching RSA pair into values/secrets.yaml on first run. Never commit
# private keys. Set auth.authenticated: true in values/defaults.yaml (or a
# profile overlay) when TMS and admin should require JWTs.
#
# Dummy placeholders the wrapper will replace: unused, password,
# auth-lib-client-test-secret, and an empty valkey password.

secrets:
  postgres:
    username: postgres
    password: unused
    replicationPassword: unused
  keycloak:
    adminUser: admin
    adminPassword: password
    clientSecret: auth-lib-client-test-secret
  auth:
    publicKey: ""
    privateKey: ""
  valkey:
    password: ""
  dockerHub:
    createPullSecret: false
    username: ""
    password: ""
    email: ""
