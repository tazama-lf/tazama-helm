# SPDX-License-Identifier: Apache-2.0
#
# Large tier. Scaled-down shape of the "$10,000 / 480-1116 TPS" rows in
# tazama-lf/docs Technical/Environment-Setup/Infrastructure/
# Infrastructure-Spec-For-Tazama.md.
#
# Reference row (TMS 40, CRSP 120, TP 600, TADP 300, 8 pods per rule) is the
# measured spec. At 33 rules that alone is 264 rule pods, so the raw numbers
# need a dedicated cluster. These keep the ratio at a fraction of the count.
#
# `rules: 2` already doubles every rule release, so each extra step here costs
# one pod per enabled rule id. Check `rules.enabled` before raising it.
#
# Spec name -> release: CRSP = event-director, TADP = event-adjudicator
# (and event-flow), REDIS = valkey, Arango = Postgres.

sizing: large

replicas:
  tms: 4
  admin: 2
  eventDirector: 8
  eventFlow: 4
  typologyProcessor: 24
  eventAdjudicator: 12
  auth: 2
  keycloak: 2
  relay: 2
  rules: 2

postgres:
  maxConnections: 1600
