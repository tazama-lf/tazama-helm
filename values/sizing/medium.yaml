# SPDX-License-Identifier: Apache-2.0
#
# Medium tier. Scaled-down shape of the "$5,000 / 240-450 TPS" rows in
# tazama-lf/docs Technical/Environment-Setup/Infrastructure/
# Infrastructure-Spec-For-Tazama.md.
#
# Reference row (TMS 30, CRSP 40, TP 280, TADP 100, 2 pods per rule) is the
# measured spec and needs a large multi-node cluster. These numbers keep the
# same ratio at a fraction of the pod count.
#
# Spec name -> release: CRSP = event-director, TADP = event-adjudicator
# (and event-flow), REDIS = valkey, Arango = Postgres.

sizing: medium

replicas:
  tms: 3
  admin: 2
  eventDirector: 4
  eventFlow: 3
  typologyProcessor: 12
  eventAdjudicator: 6
  auth: 2
  keycloak: 1
  relay: 2
  rules: 1

postgres:
  maxConnections: 800
